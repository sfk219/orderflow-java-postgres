spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/orderflow}
    username: ${DATABASE_USER:orderflow}
    password: ${DATABASE_PASSWORD:localdev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 8080
