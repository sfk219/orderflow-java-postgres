services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: localdev
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow"]
      interval: 3s
      retries: 15
    volumes: ["pg_data:/var/lib/postgresql/data"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/orderflow
      DATABASE_USER: orderflow
      DATABASE_PASSWORD: localdev
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  pg_data:
